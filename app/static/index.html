<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Release Tracker</title>
    <link
        rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2306a4d6'/><path d='M16 8a8 8 0 100 16 8 8 0 000-16zm0 2a6 6 0 110 12 6 6 0 010-12zm0 2a4 4 0 100 8 4 4 0 000-8zm0 2a2 2 0 110 4 2 2 0 010-4z' fill='white' opacity='.9'/><circle cx='16' cy='16' r='1.5' fill='white'/><path d='M16 16l4-6' stroke='white' stroke-width='1.5' stroke-linecap='round' opacity='.7'/></svg>"
    >
    <link
        rel="stylesheet"
        href="/static/style.css"
    >
    <script
        src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"
        integrity="sha384-eEu5CTj3qGvu9PdJuS+YlkNi7d2XxQROAFYOr59zgObtlcux1ae1Il3u7jvdCSWu"
        crossorigin="anonymous"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"
        integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR"
        crossorigin="anonymous"
    ></script>
    <script
        defer
        src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"
        integrity="sha384-9Ax3MmS9AClxJyd5/zafcXXjxmwFhZCdsT6HJoJjarvCaAkJlk5QDzjLJm+Wdx5F"
        crossorigin="anonymous"
    ></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        .prose-release {
            font-size: 0.8125rem;
            line-height: 1.6;
        }

        .prose-release h1,
        .prose-release h2,
        .prose-release h3 {
            font-size: 0.875rem;
            font-weight: 600;
            margin: 1em 0 0.4em;
        }

        .prose-release h1:first-child,
        .prose-release h2:first-child,
        .prose-release h3:first-child {
            margin-top: 0;
        }

        .prose-release p {
            margin: 0.4em 0;
        }

        .prose-release ul,
        .prose-release ol {
            margin: 0.4em 0;
            padding-left: 1.4em;
        }

        .prose-release li {
            margin: 0.15em 0;
        }

        .prose-release li::marker {
            color: #9ca3af;
        }

        .dark .prose-release li::marker {
            color: #6b7280;
        }

        .prose-release code {
            font-size: 0.75rem;
            padding: 0.15em 0.35em;
            border-radius: 0.25rem;
            background: #f3f4f6;
        }

        .dark .prose-release code {
            background: #1f2937;
        }

        .prose-release pre {
            margin: 0.5em 0;
            padding: 0.75em;
            border-radius: 0.5rem;
            overflow-x: auto;
            background: #f3f4f6;
            font-size: 0.75rem;
        }

        .dark .prose-release pre {
            background: #1f2937;
        }

        .prose-release pre code {
            padding: 0;
            background: none;
        }

        .prose-release a {
            color: #0284c7;
            text-decoration: none;
        }

        .prose-release a:hover {
            text-decoration: underline;
        }

        .dark .prose-release a {
            color: #38bdf8;
        }

        .prose-release hr {
            border-color: #e5e7eb;
            margin: 0.75em 0;
        }

        .dark .prose-release hr {
            border-color: #374151;
        }

        .prose-release blockquote {
            border-left: 3px solid #d1d5db;
            padding-left: 0.75em;
            margin: 0.5em 0;
            color: #6b7280;
        }

        .dark .prose-release blockquote {
            border-color: #4b5563;
            color: #9ca3af;
        }
    </style>
    <script>
        (function () {
            const t = localStorage.getItem('theme') || 'system';
            const dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (dark) document.documentElement.classList.add('dark');
            document.documentElement.lang = localStorage.getItem('ui_lang') || 'sk';
        })();
    </script>
</head>

<body
    class="bg-gray-50 dark:bg-gray-950 min-h-screen antialiased"
    x-data="tracker()"
    x-init="init()"
    x-cloak
>

    <header class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <svg
                    class="w-6 h-6"
                    viewBox="0 0 32 32"
                    fill="none"
                >
                    <rect
                        width="32"
                        height="32"
                        rx="8"
                        class="fill-brand-600 dark:fill-brand-500"
                    />
                    <path
                        d="M16 8a8 8 0 100 16 8 8 0 000-16zm0 2a6 6 0 110 12 6 6 0 010-12zm0 2a4 4 0 100 8 4 4 0 000-8zm0 2a2 2 0 110 4 2 2 0 010-4z"
                        fill="white"
                        opacity="0.9"
                    />
                    <circle
                        cx="16"
                        cy="16"
                        r="1.5"
                        fill="white"
                    />
                    <path
                        d="M16 16l4-6"
                        stroke="white"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        opacity="0.7"
                    />
                </svg>
                <span class="font-semibold text-gray-900 dark:text-gray-100 text-sm">Release Tracker</span>
            </div>
            <div class="flex items-center gap-2">
                <template x-if="authRequired && !authenticated">
                    <div class="flex items-center">
                        <form
                            x-show="showLogin"
                            x-transition
                            @submit.prevent="login()"
                            class="flex items-center gap-1.5"
                        >
                            <input
                                x-ref="tokenInput"
                                x-model="tokenInput"
                                type="password"
                                :placeholder="t.tokenPlaceholder"
                                class="border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 rounded-md px-2.5 py-1 text-xs w-40 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"
                                :class="loginError && 'border-red-400 dark:border-red-500 focus:ring-red-400'"
                            >
                            <button
                                type="submit"
                                class="text-xs font-medium text-brand-600 dark:text-brand-500 hover:text-brand-700 dark:hover:text-brand-400 transition"
                            >OK</button>
                            <button
                                type="button"
                                @click="showLogin=false; loginError=false; tokenInput=''"
                                class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300 transition"
                            >
                                <svg
                                    class="w-3.5 h-3.5"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M6 18L18 6M6 6l12 12"
                                    />
                                </svg>
                            </button>
                        </form>
                        <button
                            x-show="!showLogin"
                            @click="showLogin=true; $nextTick(() => $refs.tokenInput?.focus())"
                            class="text-xs text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition"
                            x-text="t.login"
                        ></button>
                    </div>
                </template>
                <button
                    x-show="isAdmin && authRequired"
                    @click="logout(); tab='repos'"
                    class="text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition"
                    x-text="t.logout"
                ></button>
                <div
                    class="flex bg-gray-100 dark:bg-gray-800 rounded-lg p-0.5 ml-1"
                    role="radiogroup"
                    aria-label="Theme"
                >
                    <button
                        @click="setTheme('light')"
                        :class="theme==='light' ? 'bg-white dark:bg-gray-700 shadow-sm text-amber-500' : 'text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300'"
                        class="p-1.5 rounded-md transition"
                        :aria-pressed="theme==='light'"
                        aria-label="Light theme"
                    >
                        <svg
                            class="w-4 h-4"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
                            />
                        </svg>
                    </button>
                    <button
                        @click="setTheme('dark')"
                        :class="theme==='dark' ? 'bg-white dark:bg-gray-700 shadow-sm text-indigo-400' : 'text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300'"
                        class="p-1.5 rounded-md transition"
                        :aria-pressed="theme==='dark'"
                        aria-label="Dark theme"
                    >
                        <svg
                            class="w-4 h-4"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                            />
                        </svg>
                    </button>
                    <button
                        @click="setTheme('system')"
                        :class="theme==='system' ? 'bg-white dark:bg-gray-700 shadow-sm text-gray-700 dark:text-gray-200' : 'text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300'"
                        class="p-1.5 rounded-md transition"
                        :aria-pressed="theme==='system'"
                        aria-label="System theme"
                    >
                        <svg
                            class="w-4 h-4"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                            />
                        </svg>
                    </button>
                </div>
                <div
                    class="flex bg-gray-100 dark:bg-gray-800 rounded-lg p-0.5"
                    role="radiogroup"
                    aria-label="Language"
                >
                    <button
                        @click="setLang('sk')"
                        :class="lang==='sk' ? 'bg-white dark:bg-gray-700 shadow-sm' : 'opacity-60 hover:opacity-100'"
                        class="px-1.5 py-1 rounded-md transition leading-none"
                        :aria-pressed="lang==='sk'"
                        aria-label="Slovenčina"
                    ><span class="text-sm">🇸🇰</span></button>
                    <button
                        @click="setLang('en')"
                        :class="lang==='en' ? 'bg-white dark:bg-gray-700 shadow-sm' : 'opacity-60 hover:opacity-100'"
                        class="px-1.5 py-1 rounded-md transition leading-none"
                        :aria-pressed="lang==='en'"
                        aria-label="English"
                    ><span class="text-sm">🇬🇧</span></button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
        <nav class="flex gap-6 mb-6 border-b border-gray-200 dark:border-gray-800">
            <button
                @click="tab='repos'"
                :class="tab==='repos' ? 'border-brand-500 text-brand-600 dark:text-brand-500' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:border-gray-300 dark:hover:border-gray-600'"
                class="pb-3 border-b-2 text-sm font-medium transition"
                x-text="t.repos"
            ></button>
            <button
                @click="tab='releases'"
                :class="tab==='releases' ? 'border-brand-500 text-brand-600 dark:text-brand-500' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:border-gray-300 dark:hover:border-gray-600'"
                class="pb-3 border-b-2 text-sm font-medium transition"
                x-text="t.releases"
            ></button>
            <button
                @click="tab='feeds'"
                :class="tab==='feeds' ? 'border-brand-500 text-brand-600 dark:text-brand-500' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:border-gray-300 dark:hover:border-gray-600'"
                class="pb-3 border-b-2 text-sm font-medium transition"
                x-text="t.feeds"
            ></button>
            <button
                x-show="isAdmin"
                @click="tab='settings'"
                :class="tab==='settings' ? 'border-brand-500 text-brand-600 dark:text-brand-500' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:border-gray-300 dark:hover:border-gray-600'"
                class="pb-3 border-b-2 text-sm font-medium transition"
                x-text="t.settings"
            ></button>
        </nav>

        <section
            x-show="tab==='repos'"
            x-transition.opacity
        >
            <form
                x-show="isAdmin"
                @submit.prevent="addRepo()"
                class="flex gap-2 mb-5"
            >
                <input
                    x-model="newRepo"
                    type="text"
                    :placeholder="t.addPlaceholder"
                    class="flex-1 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition placeholder:text-gray-400 dark:placeholder:text-gray-500"
                >
                <button
                    type="submit"
                    class="bg-brand-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-brand-700 active:bg-brand-800 transition shadow-sm"
                    x-text="t.add"
                ></button>
            </form>
            <div
                class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 overflow-hidden">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-gray-100 dark:border-gray-800">
                            <th
                                class="px-5 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                                x-text="t.repository"
                            ></th>
                            <th
                                class="px-5 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                                x-text="t.lastRelease"
                            ></th>
                            <th
                                class="px-5 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                                x-text="t.date"
                            ></th>
                            <th class="px-5 py-3 w-12"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-50 dark:divide-gray-800/50">
                        <template
                            x-for="repo in repos"
                            :key="repo.id"
                        >
                            <tr class="hover:bg-gray-50/50 dark:hover:bg-gray-800/50 transition">
                                <td class="px-5 py-3.5">
                                    <a
                                        :href="'https://github.com/'+repo.owner+'/'+repo.repo"
                                        target="_blank"
                                        class="font-medium text-gray-900 dark:text-gray-100 hover:text-brand-600 dark:hover:text-brand-500 transition"
                                        x-text="repo.owner+'/'+repo.repo"
                                    ></a>

                                </td>
                                <td class="px-5 py-3.5">
                                    <span
                                        x-show="repo.last_tag"
                                        class="inline-flex items-center bg-brand-50 dark:bg-brand-500/10 text-brand-700 dark:text-brand-400 text-xs font-medium px-2 py-0.5 rounded-md"
                                        x-text="repo.last_tag"
                                    ></span>
                                    <span
                                        x-show="!repo.last_tag"
                                        class="text-gray-300 dark:text-gray-600"
                                    >—</span>
                                </td>
                                <td
                                    class="px-5 py-3.5 text-gray-500 dark:text-gray-400"
                                    x-text="repo.last_release_at ? new Date(repo.last_release_at).toLocaleDateString() : '—'"
                                ></td>
                                <td class="px-5 py-3.5 text-right">
                                    <button
                                        x-show="isAdmin"
                                        @click="deleteRepo(repo.id)"
                                        class="text-gray-300 dark:text-gray-600 hover:text-red-500 dark:hover:text-red-400 transition"
                                        :title="t.remove"
                                    >
                                        <svg
                                            class="w-4 h-4"
                                            fill="none"
                                            viewBox="0 0 24 24"
                                            stroke="currentColor"
                                            stroke-width="1.5"
                                        >
                                            <path
                                                stroke-linecap="round"
                                                stroke-linejoin="round"
                                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                                            />
                                        </svg>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div
                    x-show="repos.length === 0"
                    class="px-5 py-12 text-center text-gray-400 dark:text-gray-500 text-sm"
                    x-text="t.noRepos"
                ></div>
            </div>
        </section>

        <section
            x-show="tab==='releases'"
            x-transition.opacity
        >
            <div class="space-y-3">
                <template
                    x-for="rel in releases"
                    :key="rel.id"
                >
                    <div
                        @click="openRelease(rel)"
                        class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-5 hover:border-brand-300 dark:hover:border-brand-700 cursor-pointer transition group"
                    >
                        <div class="flex items-start justify-between gap-4">
                            <div class="min-w-0 flex-1">
                                <div class="flex items-center gap-2 mb-2">
                                    <span
                                        class="font-medium text-gray-900 dark:text-gray-100 group-hover:text-brand-600 dark:group-hover:text-brand-500 transition truncate"
                                        x-text="rel.owner+'/'+rel.repo"
                                    ></span>
                                    <span
                                        class="shrink-0 inline-flex items-center bg-brand-50 dark:bg-brand-500/10 text-brand-700 dark:text-brand-400 text-xs font-medium px-2 py-0.5 rounded-md"
                                        x-text="rel.tag_name"
                                    ></span>
                                    <span
                                        x-show="rel.name && rel.name !== rel.tag_name"
                                        class="hidden sm:inline text-xs text-gray-400 dark:text-gray-500 truncate"
                                        x-text="rel.name"
                                    ></span>
                                </div>
                                <div
                                    x-show="rel.summary"
                                    class="prose-release text-gray-600 dark:text-gray-400 mb-2 line-clamp-3"
                                    x-html="renderMd(rel.summary)"
                                ></div>
                                <div class="flex items-center gap-3 text-xs text-gray-400 dark:text-gray-500">
                                    <span x-text="rel.published_at ? formatDate(rel.published_at) : ''"></span>
                                    <span
                                        class="group-hover:text-brand-500 transition"
                                        x-text="t.viewDetail + ' →'"
                                    ></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
                <div
                    x-show="releases.length === 0"
                    class="text-center text-gray-400 dark:text-gray-500 text-sm py-12"
                    x-text="t.noReleases"
                ></div>
                <button
                    x-show="releasesHasMore"
                    @click="loadReleases(true)"
                    class="w-full mt-3 py-2.5 text-sm font-medium text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition"
                    x-text="t.loadMore"
                ></button>
            </div>
        </section>

        <section
            x-show="tab==='feeds'"
            x-transition.opacity
        >
            <div
                x-show="isAdmin"
                class="flex gap-2 mb-5"
            >
                <form
                    @submit.prevent="addFeed()"
                    class="flex gap-2 flex-1"
                >
                    <input
                        x-model="newFeedName"
                        type="text"
                        :placeholder="t.feedNamePlaceholder"
                        class="w-48 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition placeholder:text-gray-400 dark:placeholder:text-gray-500"
                    >
                    <input
                        x-model="newFeedUrl"
                        type="text"
                        :placeholder="t.feedUrlPlaceholder"
                        class="flex-1 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition placeholder:text-gray-400 dark:placeholder:text-gray-500 font-mono placeholder:font-sans"
                    >
                    <button
                        type="submit"
                        class="bg-brand-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-brand-700 active:bg-brand-800 transition shadow-sm"
                        x-text="t.add"
                    ></button>
                </form>
                <button
                    @click="checkNow()"
                    :disabled="checking"
                    class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-300 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-700 active:bg-gray-100 dark:active:bg-gray-600 transition disabled:opacity-50 shadow-sm shrink-0"
                >
                    <span
                        x-show="!checking"
                        x-text="t.checkNow"
                    ></span>
                    <span
                        x-show="checking"
                        class="flex items-center gap-1.5"
                    >
                        <svg
                            class="animate-spin w-3.5 h-3.5"
                            viewBox="0 0 24 24"
                            fill="none"
                        >
                            <circle
                                cx="12"
                                cy="12"
                                r="10"
                                stroke="currentColor"
                                stroke-width="3"
                                class="opacity-25"
                            />
                            <path
                                d="M4 12a8 8 0 018-8"
                                stroke="currentColor"
                                stroke-width="3"
                                stroke-linecap="round"
                                class="opacity-75"
                            />
                        </svg>
                        <span x-text="t.checking"></span>
                    </span>
                </button>
            </div>

            <div
                x-show="feeds.length > 0"
                class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 overflow-hidden mb-5"
            >
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-gray-100 dark:border-gray-800">
                            <th
                                class="px-5 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider"
                                x-text="t.feedName"
                            ></th>
                            <th

        function tracker() {
            return {
                tab: 'repos',
                theme: localStorage.getItem('theme') || 'system',
                lang: localStorage.getItem('ui_lang') || 'sk',
                repos: [],
                releases: [],
                releasesHasMore: false,
                feeds: [],
                feedEntries: [],
                feedEntriesHasMore: false,
                newFeedName: '',
                newFeedUrl: '',
                newRepo: '',
                checking: false,
                summarizing: false,
                signalTesting: false,
                authRequired: false,
                authenticated: false,
                tokenInput: '',
                loginError: false,
                showLogin: false,
                settingsTab: 'general',
                settingsForm: {
                    check_interval: 60,
                    signal_enabled: false,
                    signal_api_url: '',
                    signal_sender: '',
                    signal_group_id: '',
                    summary_language: 'sk',
                    ai_enabled: false,
                    ai_model: 'claude-haiku-4-5-20251001',
                    anthropic_api_key: '',
                },
                aiUsage: null,
                releaseModal: false,
                selectedRelease: null,
                confirmModal: false,
                confirmMsg: '',
                confirmResolve: null,
                confirmReject: null,
                toast: false,
                toastMsg: '',
                toastType: 'success',
                toastTimer: null,

                get t() { return i18n[this.lang] || i18n.sk; },
                get isAdmin() { return !this.authRequired || this.authenticated; },
                get aiOn() { return this.settingsForm.ai_enabled === true || this.settingsForm.ai_enabled === 'true'; },

                authHeaders(extra = {}) {
                    const token = localStorage.getItem('api_token');
                    const h = { ...extra };
                    if (token) h['Authorization'] = `Bearer ${token}`;
                    return h;
                },

                setTheme(t) {
                    this.theme = t;
                    localStorage.setItem('theme', t);
                    this.applyTheme();
                },

                applyTheme() {
                    const isDark = this.theme === 'dark' || (this.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                    document.documentElement.classList.toggle('dark', isDark);
                },

                renderMd(text) {
                    if (!text) return '';
                    try { return DOMPurify.sanitize(marked.parse(text, { breaks: true })); } catch { return DOMPurify.sanitize(text); }
                },

                formatDate(d) {
                    return new Date(d).toLocaleDateString(this.lang === 'sk' ? 'sk-SK' : 'en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                },

                openRelease(rel) {
                    this.selectedRelease = { ...rel, _id: rel.id, _type: 'release' };
                    this.releaseModal = true;
                },

                confirm(msg) {
                    return new Promise((resolve, reject) => {
                        this.confirmMsg = msg;
                        this.confirmResolve = resolve;
                        this.confirmReject = reject;
                        this.confirmModal = true;
                    });
                },

                showToast(msg, type = 'success') {
                    clearTimeout(this.toastTimer);
                    this.toastMsg = msg;
                    this.toastType = type;
                    this.toast = true;
                    this.toastTimer = setTimeout(() => this.toast = false, 2500);
                },

                setLang(l) {
                    this.lang = l;
                    localStorage.setItem('ui_lang', l);
                    document.documentElement.lang = l;
                },

                async login() {
                    this.loginError = false;
                    const r = await fetch('/api/settings', { headers: { 'Authorization': `Bearer ${this.tokenInput}` } });
                    if (r.ok) {
                        localStorage.setItem('api_token', this.tokenInput);
                        this.authenticated = true;
                        this.tokenInput = '';
                        this.showLogin = false;
                        await this.loadSettings();
                    } else {
                        this.loginError = true;
                    }
                },

                logout() {
                    localStorage.removeItem('api_token');
                    this.authenticated = false;
                    if (this.tab === 'settings') this.tab = 'repos';
                },

                parseRepo(input) {
                    input = input.trim();
                    const urlMatch = input.match(/github\.com\/([^/]+)\/([^/]+)/);
                    if (urlMatch) return { owner: urlMatch[1], repo: urlMatch[2].replace(/\.git$/, '') };
                    const parts = input.split('/');
                    if (parts.length === 2 && parts[0] && parts[1]) return { owner: parts[0].trim(), repo: parts[1].trim() };
                    return null;
                },

                async init() {
                    this.applyTheme();
                    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => this.applyTheme());
                    const authCheck = await (await fetch('/api/auth/check')).json();
                    this.authRequired = authCheck.required;
                    if (this.authRequired && localStorage.getItem('api_token')) {
                        const r = await fetch('/api/settings', { headers: this.authHeaders() });
                        this.authenticated = r.ok;
                        if (!r.ok) localStorage.removeItem('api_token');
                    }
                    await this.loadRepos();
                    await this.loadReleases();
                    await this.loadFeeds();
                    await this.loadFeedEntries();
                    if (this.isAdmin) await this.loadSettings();
                    if (this.isAdmin) await this.loadAiUsage();
                },

                async loadRepos() {
                    this.repos = await (await fetch('/api/repos')).json();
                },

                async loadReleases(append = false) {
                    const offset = append ? this.releases.length : 0;
                    const data = await (await fetch(`/api/releases?limit=20&offset=${offset}`)).json();
                    if (append) { this.releases.push(...data); } else { this.releases = data; }
                    this.releasesHasMore = data.length === 20;
                },

                async loadFeeds() {
                    this.feeds = await (await fetch('/api/feeds')).json();
                },

                async loadFeedEntries(append = false) {
                    const offset = append ? this.feedEntries.length : 0;
                    const data = await (await fetch(`/api/feed-entries?limit=20&offset=${offset}`)).json();
                    if (append) { this.feedEntries.push(...data); } else { this.feedEntries = data; }
                    this.feedEntriesHasMore = data.length === 20;
                },

                async loadSettings() {
                    const r = await fetch('/api/settings', { headers: this.authHeaders() });
                    if (!r.ok) return;
                    const s = await r.json();
                    if (s.check_interval) this.settingsForm.check_interval = s.check_interval;
                    if (s.signal_enabled !== undefined) this.settingsForm.signal_enabled = s.signal_enabled === 'true' || s.signal_enabled === true;
                    if (s.signal_api_url) this.settingsForm.signal_api_url = s.signal_api_url;
                    if (s.signal_sender) this.settingsForm.signal_sender = s.signal_sender;
                    if (s.signal_group_id) this.settingsForm.signal_group_id = s.signal_group_id;
                    if (s.summary_language) this.settingsForm.summary_language = s.summary_language;
                    if (s.ai_enabled !== undefined) this.settingsForm.ai_enabled = s.ai_enabled === 'true' || s.ai_enabled === true;
                    if (s.ai_model) this.settingsForm.ai_model = s.ai_model;
                    if (s.anthropic_api_key !== undefined) this.settingsForm.anthropic_api_key = s.anthropic_api_key;
                },

                async loadAiUsage() {
                    const r = await fetch('/api/ai-usage', { headers: this.authHeaders() });
                    if (r.ok) this.aiUsage = await r.json();
                },

                async addRepo() {
                    const parsed = this.parseRepo(this.newRepo);
                    if (!parsed) return this.showToast(this.t.invalidInput, 'error');
                    const r = await fetch('/api/repos', {
                        method: 'POST',
                        headers: this.authHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify(parsed),
                    });
                    if (r.ok) {
                        this.showToast(this.t.repoAdded.replace('{repo}', `${parsed.owner}/${parsed.repo}`), 'success');
                        this.newRepo = '';
                        await this.loadRepos();
                    } else {
                        const err = await r.json();
                        this.showToast(err.detail || 'Error', 'error');
                    }
                },

                async deleteRepo(id) {
                    try { await this.confirm(this.t.confirmRemove); } catch { return; }
                    await fetch(`/api/repos/${id}`, { method: 'DELETE', headers: this.authHeaders() });
                    this.showToast(this.t.repoRemoved, 'success');
                    await this.loadRepos();
                },

                async addFeed() {
                    if (!this.newFeedUrl.trim()) return this.showToast(this.t.invalidFeedInput, 'error');
                    let url = this.newFeedUrl.trim();
                    if (!url.match(/^https?:\/\//)) url = 'https://' + url;
                    let name = this.newFeedName.trim();
                    if (!name) {
                        try { name = new URL(url).hostname.replace(/^www\./, ''); } catch { name = url; }
                    }
                    const r = await fetch('/api/feeds', {
                        method: 'POST',
                        headers: this.authHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify({ name, url }),
                    });
                    if (r.ok) {
                        this.showToast(this.newFeedName + ' added', 'success');
                        this.newFeedName = '';
                        this.newFeedUrl = '';
                        await this.loadFeeds();
                    } else {
                        const err = await r.json();
                        this.showToast(err.detail || 'Error', 'error');
                    }
                },

                async toggleScrape(feed) {
                    const enabled = !feed.scrape_enabled;
                    await fetch(`/api/feeds/${feed.id}`, {
                        method: 'PATCH',
                        headers: this.authHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify({ scrape_enabled: enabled }),
                    });
                    feed.scrape_enabled = enabled ? 1 : 0;
                    this.showToast(enabled ? this.t.enableScraping : this.t.disableScraping, 'success');
                },

                async deleteFeed(id) {
                    try { await this.confirm(this.t.confirmRemove); } catch { return; }
                    await fetch(`/api/feeds/${id}`, { method: 'DELETE', headers: this.authHeaders() });
                    this.showToast(this.t.repoRemoved, 'success');
                    await this.loadFeeds();
                    await this.loadFeedEntries();
                },

                openFeedEntry(entry) {
                    this.selectedRelease = {
                        _id: entry.id,
                        _type: 'feed',
                        owner: entry.feed_name,
                        repo: '',
                        tag_name: '',
                        name: entry.title,
                        published_at: entry.published_at,
                        summary: entry.summary,
                        body: entry.body,
                        _feedUrl: entry.url,
                    };
                    this.releaseModal = true;
                },

                async summarizeSelected() {
                    const rel = this.selectedRelease;
                    if (!rel) return;
                    this.summarizing = true;
                    try {
                        const isFeed = rel._type === 'feed';
                        const url = isFeed ? `/api/feed-entries/${rel._id}/summarize` : `/api/releases/${rel._id}/summarize`;
                        const r = await fetch(url, { method: 'POST', headers: this.authHeaders() });
                        if (r.ok) {
                            const data = await r.json();
                            rel.summary = data.summary;
                            this.showToast(this.t.aiSummary + ' ✓', 'success');
                        } else {
                            const err = await r.json();
                            this.showToast(err.detail || 'Error', 'error');
                        }
                    } finally {
                        this.summarizing = false;
                    }
                },

                async testSignal() {
                    this.signalTesting = true;
                    try {
                        const r = await fetch('/api/signal/test', { method: 'POST', headers: this.authHeaders() });
                        if (r.ok) {
                            this.showToast(this.t.signalTestSent, 'success');
                        } else {
                            const err = await r.json();
                            this.showToast(err.detail || this.t.signalTestFailed, 'error');
                        }
                    } catch {
                        this.showToast(this.t.signalTestFailed, 'error');
                    } finally {
                        this.signalTesting = false;
                    }
                },

                async saveSettings() {
                    const data = { ...this.settingsForm, ai_enabled: this.aiOn ? 'true' : 'false', signal_enabled: this.settingsForm.signal_enabled ? 'true' : 'false' };
                    const r = await fetch('/api/settings', {
                        method: 'PUT',
                        headers: this.authHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify(data),
                    });
                    this.showToast(r.ok ? this.t.saved : this.t.saveError, r.ok ? 'success' : 'error');
                },

                async checkNow() {
                    this.checking = true;
                    this.showToast(this.t.checkStarted, 'info');
                    await fetch('/api/check', { method: 'POST', headers: this.authHeaders() });
                    setTimeout(async () => {
                        await this.loadReleases();
                        await this.loadRepos();
                        await this.loadFeeds();
                        await this.loadFeedEntries();
                        this.checking = false;
                        this.showToast(this.t.checkDone, 'success');
                    }, 3000);
                },
            };
        }
    </script>
